services:

  # ---------------------------------------------------------------------------
  # ardacraft  — MC :25565  |  remote debug :5005
  # ---------------------------------------------------------------------------
  ardacraft:
    image: itzg/minecraft-server:java21-alpine
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - huskhomes-net
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.20.1"
      FABRIC_LOADER_VERSION: "0.16.10"
      MODE: creative
      FORCE_GAMEMODE: "TRUE"
      MEMORY: 1G
      ONLINE_MODE: "false"
      JVM_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "25565:25565"
      - "5005:5005"
    volumes:
      - ardacraft_data:/data
      - ./dev/mods/ardacraft:/data/mods:z
      - ./dev/config/ardacraft:/data/config:z

  # ---------------------------------------------------------------------------
  # building  — MC :25566  |  remote debug :5006
  # ---------------------------------------------------------------------------
  building:
    image: itzg/minecraft-server:java21-alpine
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - huskhomes-net
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.20.1"
      FABRIC_LOADER_VERSION: "0.16.10"
      MODE: creative
      FORCE_GAMEMODE: "TRUE"
      MEMORY: 1G
      ONLINE_MODE: "false"
      JVM_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    ports:
      - "25566:25565"
      - "5006:5006"
    volumes:
      - building_data:/data
      - ./dev/mods/building:/data/mods:z
      - ./dev/config/building:/data/config:z

