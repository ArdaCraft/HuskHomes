  # ---------------------------------------------------------------------------
  # redis  — message broker for HuskHomes cross-server messaging
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - huskhomes-net

  # ---------------------------------------------------------------------------
  # velocity  — proxy :25577  |  players connect here, not to individual servers
  # ---------------------------------------------------------------------------
  velocity:
    image: itzg/mc-proxy
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - huskhomes-net
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: "3.3.0-SNAPSHOT"
    ports:
      - "25577:25577"
    volumes:
      - ./dev/config/velocity:/server:z
    depends_on:
      - ardacraft
      - building
#      - lobby
